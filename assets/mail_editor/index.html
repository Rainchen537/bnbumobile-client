<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <style>
      :root { color-scheme: only light; background: #ffffff; }
      :root[data-theme="dark"] { color-scheme: only dark; background: #1d2228; }
      * { box-sizing: border-box; }
      html, body, #editor { min-height: 100%; margin: 0; }
      body {
        color: #172235;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        font-size: 11pt;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .bnbu-mail-editor { min-height: 100%; padding: 16px 0 28px; outline: none; white-space: normal; }
      .bnbu-mail-editor p { margin: 0 0 1em; }
      .bnbu-mail-editor p.is-editor-empty:first-child::before {
        color: #9aa5b3; content: attr(data-placeholder); float: left; height: 0; pointer-events: none;
      }
      .bnbu-mail-editor blockquote {
        border-left: 3px solid #c7d1dc; color: #5d6a79; margin: 1em 0; padding-left: 12px;
      }
      .bnbu-mail-editor hr { border: 0; border-top: 1px solid #d7dee7; margin: 18px 0; }
      .bnbu-mail-editor img { display: block; height: auto; margin: 12px 0; max-width: 100%; }
      .bnbu-mail-table { border-collapse: collapse; margin: 12px 0; table-layout: fixed; width: 100%; }
      .bnbu-mail-table td, .bnbu-mail-table th {
        border: 1px solid #cbd5df; min-width: 64px; padding: 7px 9px; vertical-align: top;
      }
      .bnbu-mail-table th { background: #f1f5f8; font-weight: 600; }
      .selectedCell::after {
        background: rgba(49, 135, 244, .14); content: ""; inset: 0; pointer-events: none; position: absolute;
      }
      .column-resize-handle { background: #3187f4; bottom: -2px; position: absolute; right: -2px; top: 0; width: 3px; }
      :root[data-theme="dark"] body { color: #eceff3; }
      :root[data-theme="dark"] .bnbu-mail-editor p.is-editor-empty:first-child::before { color: #77818e; }
      :root[data-theme="dark"] .bnbu-mail-editor blockquote { border-left-color: #4a525c; color: #a9b1ba; }
      :root[data-theme="dark"] .bnbu-mail-editor hr { border-top-color: #343b43; }
      :root[data-theme="dark"] .bnbu-mail-table td, :root[data-theme="dark"] .bnbu-mail-table th { border-color: #4b535d; }
      :root[data-theme="dark"] .bnbu-mail-table th { background: #343436; }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script src="editor.js"></script>
  </body>
</html>
